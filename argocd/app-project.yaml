# Argo CD AppProject groups and secures all Moment Forever CD applications.
# Think of this as a policy boundary for what these apps are allowed to touch.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: moment-forever
  namespace: argocd
spec:
  description: Project boundary for Moment Forever services in dev environment.

  # sourceRepos controls which Git repositories applications in this project can use.
  sourceRepos:
    - "https://github.com/ForeverMoment-Corp/moment-forever-infra.git"

  # destinations controls where apps can deploy.
  # argocd namespace: root-app creates child Application objects here.
  # moment-forever-dev: where actual service pods are deployed.
  # kubernetes-dashboard: Kubernetes Dashboard UI and its admin-user ServiceAccount.
  destinations:
    - namespace: moment-forever-dev
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: kubernetes-dashboard
      server: https://kubernetes.default.svc

  # clusterResourceWhitelist allows cluster-scoped objects if needed.
  # ClusterRole/ClusterRoleBinding are required by the Kubernetes Dashboard
  # manifests and by the admin-user cluster-admin binding.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

  # namespaceResourceWhitelist allows namespaced resources managed by this project.
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: ServiceAccount
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: argoproj.io
      kind: Application
    - group: networking.k8s.io
      kind: Ingress

