# Child application for payment service.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: moment-forever-payment-dev
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: payment=groote123/moment-forever-payment
    argocd-image-updater.argoproj.io/payment.allow-tags: regexp:^[a-f0-9]{40}$
    argocd-image-updater.argoproj.io/payment.update-strategy: newest-build
    argocd-image-updater.argoproj.io/payment.force-update: "true"
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/write-back-target: kustomization
spec:
  project: moment-forever
  source:
    repoURL: "https://github.com/ForeverMoment-Corp/moment-forever-infra.git"
    targetRevision: main
    path: clusters/dev/payment
  destination:
    server: https://kubernetes.default.svc
    namespace: moment-forever-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
