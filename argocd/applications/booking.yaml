# Child application for booking service.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: moment-forever-booking-dev
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: booking=groote123/moment-forever-booking
    argocd-image-updater.argoproj.io/booking.allow-tags: regexp:^[a-f0-9]{40}$
    argocd-image-updater.argoproj.io/booking.update-strategy: newest-build
    # Force Image Updater to check Docker Hub regardless of whether the image
    # appears in status.summary.images (which is empty when pods are crashing).
    argocd-image-updater.argoproj.io/booking.force-update: "true"
    argocd-image-updater.argoproj.io/write-back-method: git
    # Do NOT add a sub-path here — Image Updater appends the target to the
    # cloned source path, which would double it to clusters/dev/booking/clusters/dev/booking.
    argocd-image-updater.argoproj.io/write-back-target: kustomization
spec:
  # project applies AppProject security and policy constraints.
  project: moment-forever
  source:
    # This is the infra repo Argo reads as source of truth.
    repoURL: "https://github.com/ForeverMoment-Corp/moment-forever-infra.git"
    targetRevision: main
    # This path points only to booking manifests for dev environment.
    path: clusters/dev/booking
  destination:
    # Deploy into in-cluster API server and dev namespace.
    server: https://kubernetes.default.svc
    namespace: moment-forever-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
