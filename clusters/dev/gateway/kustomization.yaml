# Kustomization groups the gateway Kubernetes resources for dev.
# Argo CD renders this folder through Kustomize before applying to cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- configmap.yaml
- secret.yaml
- deployment.yaml
- service.yaml
# Image updater edits newTag below to move deployments to new commit SHA.
# Keep `name` exactly equal to image name used in deployment manifests.
images:
- name: groote123/moment-forever-gateway
  newTag: c3e259c4f8d986e3fa2957ab0b9f8dd7f806b6aa
