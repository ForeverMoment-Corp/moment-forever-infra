# Gateway deployment in dev.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: moment-forever-dev
  labels:
    app: gateway
spec:
  # replicas controls how many pod copies run at the same time.
  replicas: 1
  selector:
    # selector must match pod template labels exactly.
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: groote123/moment-forever-gateway:latest
          # IfNotPresent is fine for dev; production commonly uses Always with immutable tags.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
          # Load non-sensitive configuration values from ConfigMap.
          envFrom:
            - configMapRef:
                name: gateway-config
            # Load sensitive values (jwt secret) from Secret.
            - secretRef:
                name: gateway-secret
          readinessProbe:
            # Readiness says "can this pod receive traffic now?"
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            # Liveness says "is this pod alive, or should Kubernetes restart it?"
            httpGet:
              path: /actuator/health
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 20
