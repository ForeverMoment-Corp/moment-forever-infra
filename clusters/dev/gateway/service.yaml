# Cluster-internal service for gateway pods.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: moment-forever-dev
  labels:
    app: gateway
spec:
  # selector chooses which pods receive traffic for this service.
  selector:
    app: gateway
  ports:
    - name: http
      # service port is how other pods call this service inside cluster.
      port: 80
      # targetPort is container port exposed by the pod.
      targetPort: 8086
  # ClusterIP means internal-only service (not exposed to internet).
  type: ClusterIP
