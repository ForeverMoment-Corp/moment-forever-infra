# Non-sensitive runtime configuration for platform service.
# Values are aligned with docker-compose service host names.
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: moment-forever-dev
data:
  CONSUL_HOST: consul
  POSTGRES_HOST: postgres-platform
  MONGO_HOST: mongo-booking
  REDIS_HOST: redis
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  # Public Google OAuth client id used to validate Google ID token audience.
  # Replace this placeholder with the real client id before enabling Google sign-in.
  GOOGLE_OIDC_CLIENT_ID: replace-with-google-client-id.apps.googleusercontent.com
  JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Kolkata
  # Tell Spring Boot to auto-create Quartz scheduler tables on startup.
  SPRING_QUARTZ_JDBC_INITIALIZE_SCHEMA: always
  MANAGEMENT_HEALTH_KAFKA_ENABLED: "false"
