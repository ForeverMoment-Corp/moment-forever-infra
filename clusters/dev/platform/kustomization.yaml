# Kustomization groups the platform Kubernetes resources for dev.
# Argo CD renders this folder through Kustomize before applying to cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- configmap.yaml
- secret.yaml
- deployment.yaml
- service.yaml
# Image updater edits newTag below to move deployments to new commit SHA.
# Keep `name` exactly equal to image name used in deployment manifests.
images:
- name: groote123/moment-forever-platform
  newTag: ef28cd2ea3c2fa1c68e3484a08f6d56f10f3cda7
