# Single-instance PostgreSQL for the platform service in dev.
# StatefulSet is the right resource for databases (stable name + storage).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-platform
  namespace: moment-forever-dev
  labels:
    app: postgres-platform
spec:
  serviceName: postgres-platform
  replicas: 1
  selector:
    matchLabels:
      app: postgres-platform
  template:
    metadata:
      labels:
        app: postgres-platform
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            # Credentials and DB name match docker-compose postgres-platform exactly.
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: groote
            - name: POSTGRES_DB
              value: moment_forever_db
            - name: TZ
              value: Asia/Kolkata
            - name: PGTZ
              value: Asia/Kolkata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
  # Persistent storage so data survives pod restarts.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
