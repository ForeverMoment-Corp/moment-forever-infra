# Payment deployment in dev.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: moment-forever-dev
  labels:
    app: payment
spec:
  # replicas controls how many pod copies run at the same time.
  replicas: 1
  selector:
    # selector must match pod template labels exactly.
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      containers:
        - name: payment
          image: groote123/moment-forever-payment:latest
          # IfNotPresent is fine for dev; production commonly uses Always with immutable tags.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          # Load non-sensitive configuration values from ConfigMap.
          envFrom:
            - configMapRef:
                name: payment-config
            # Load sensitive values (db password, optional gateway keys) from Secret.
            - secretRef:
                name: payment-secret
          readinessProbe:
            # Readiness says "can this pod receive traffic now?"
            httpGet:
              path: /payment/actuator/health
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            # Liveness says "is this pod alive, or should Kubernetes restart it?"
            httpGet:
              path: /payment/actuator/health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 20
