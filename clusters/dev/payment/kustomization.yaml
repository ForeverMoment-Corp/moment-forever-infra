# Kustomization groups the payment Kubernetes resources for dev.
# Argo CD renders this folder through Kustomize before applying to cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

# Image updater edits newTag below to move deployments to new commit SHA.
# Keep `name` exactly equal to image name used in deployment manifests.
images:
  - name: groote123/moment-forever-payment
    newTag: 7b0ce0fa8f040f719354a813480f0110b00959e7

