# Non-sensitive runtime configuration for payment service.
# Values are aligned with docker-compose service host names.
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-config
  namespace: moment-forever-dev
data:
  CONSUL_HOST: consul
  POSTGRES_HOST: postgres-payment
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Kolkata
  MANAGEMENT_HEALTH_KAFKA_ENABLED: "false"
