apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    # cert-manager watches this annotation and issues/renews a real Let's
    # Encrypt certificate into the secret named below (ingress-shim).
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - argocd.15.134.55.225.nip.io
      secretName: argocd-server-tls
  rules:
    - host: argocd.15.134.55.225.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
