# Single-instance MongoDB for dev. Named mongo-booking because that's what
# the current configmaps expect. We'll revisit if that turns out to be a typo.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-booking
  namespace: moment-forever-dev
  labels:
    app: mongo-booking
spec:
  serviceName: mongo-booking
  replicas: 1
  selector:
    matchLabels:
      app: mongo-booking
  template:
    metadata:
      labels:
        app: mongo-booking
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-booking
  namespace: moment-forever-dev
  labels:
    app: mongo-booking
spec:
  selector:
    app: mongo-booking
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
