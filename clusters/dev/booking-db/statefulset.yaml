# Single-instance PostgreSQL for the booking service in dev.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-booking
  namespace: moment-forever-dev
  labels:
    app: postgres-booking
spec:
  serviceName: postgres-booking
  replicas: 1
  selector:
    matchLabels:
      app: postgres-booking
  template:
    metadata:
      labels:
        app: postgres-booking
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: groote
            - name: POSTGRES_DB
              value: moment_forever_book
            - name: TZ
              value: Asia/Kolkata
            - name: PGTZ
              value: Asia/Kolkata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-booking
  namespace: moment-forever-dev
  labels:
    app: postgres-booking
spec:
  selector:
    app: postgres-booking
  ports:
    - name: postgres
      port: 5433
      targetPort: 5432
  type: ClusterIP
